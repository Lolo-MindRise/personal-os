# Guard configuration for this repository (ADR-0008).
# Maintained by Manuel only: the guard blocks agents from editing it.

# branches   = agents commit and push their own branches and open PRs; Manuel merges.
# supervised = agents never commit, push or open PRs; Manuel does.
AUTONOMY=branches

# The branch only Manuel merges into. Agents can never commit or push to it.
DEFAULT_BRANCH=main

# Extended regular expression of paths agents may never touch:
# real instances, real data, backups.
PROTECTED_PATHS=apps/personal-os|\.local/share/personal-os|apps_personales/personal_os|\.config/personal-os

# Extended regular expression of commands agents may never run: scripts that
# reach real instances through their own configuration (no path in the text).
PROTECTED_COMMANDS=(^|[[:space:]/"])(start|stop|restore|deploy-local|rehearse-migration)\.sh([[:space:]"]|$)
